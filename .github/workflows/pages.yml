# Publishes the site to GitHub Pages. The download buttons read release.json, written here from the
# Venture repo's Releases API; a "venture-release" dispatch or a manual run picks up a new release between pushes.
name: Pages

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [venture-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VENTURE_REPO: ${{ vars.VENTURE_REPO || 'Villagers654/Venture' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest published full release, else the newest pre-release; {"repo": ...} when there is
        # none or the repo is not readable, so the buttons fall back to the releases page.
        run: |
          releases=$(gh api "repos/${VENTURE_REPO}/releases?per_page=20" 2>/dev/null) || releases='[]'
          jq '
            [.[] | select(.draft | not)] as $r
            | ([$r[] | select(.prerelease | not)] + $r)[0] // {}
            | if .tag_name then {
                tag: .tag_name, name, published_at, html_url, prerelease,
                assets: [.assets[] | {name, size, url: .browser_download_url, digest}]
              } else {} end
            | . + {repo: env.VENTURE_REPO}' <<<"$releases" > release.json
          cat release.json
          printf '%s' "$releases" > "$RUNNER_TEMP/releases.json"
      - name: Latest alpha
        # /alpha sends visitors to the newest Venture release, alpha or stable: the pre-release unless a stable
        # release is ahead of it (0.3.0 > 0.3.0-alpha.N > 0.2.5.1, compared as the launcher's updater does).
        # The page asks the GitHub API first with the same rule; this build-time URL is its fallback after 2 s,
        # its button link and its no-script refresh, and goes in alpha.json.
        run: |
          python3 - <<'PY'
          import html, json, os
          repo = os.environ["VENTURE_REPO"]
          releases = json.load(open(os.environ["RUNNER_TEMP"] + "/releases.json"))

          def parse(tag):
              # src/launcher/updater.cpp newer_version: "v" prefix, dot-separated numbers, "-..." = pre-release.
              tag = tag[1:] if tag.startswith("v") else tag
              base, dash, rest = tag.partition("-")
              parts = base.split(".")
              if not all(p.isdigit() and p.isascii() for p in parts):
                  return None
              return [int(p) for p in parts], bool(rest)

          def newer(a, b):
              x, y = parse(a), parse(b)
              if not x or not y:
                  return False
              n = max(len(x[0]), len(y[0]))
              xp, yp = x[0] + [0] * (n - len(x[0])), y[0] + [0] * (n - len(y[0]))
              return xp > yp if xp != yp else (y[1] and not x[1])

          best = None
          for r in releases if isinstance(releases, list) else []:
              if r.get("draft") or not r.get("published_at") or not parse(r.get("tag_name", "")):
                  continue
              # Equal versions (two alphas of one release) go to the newer publish.
              if best is None or newer(r["tag_name"], best["tag_name"]) or (
                      not newer(best["tag_name"], r["tag_name"]) and r["published_at"] > best["published_at"]):
                  best = r
          alpha = {"repo": repo}
          if best:
              alpha |= {"tag": best["tag_name"], "name": best.get("name"), "published_at": best["published_at"],
                        "html_url": best["html_url"], "prerelease": best["prerelease"]}
          json.dump(alpha, open("alpha.json", "w"))
          print(json.dumps(alpha))

          url = alpha.get("html_url", "")
          page = open("alpha/index.html").read()
          marker = "<!-- alpha:refresh (pages.yml writes a no-script meta refresh to the newest release here) -->"
          assert marker in page and 'data-alpha=""' in page
          if url.startswith(f"https://github.com/{repo}/releases/"):
              u = html.escape(url, quote=True)
              page = page.replace(marker, f'<noscript><meta http-equiv="refresh" content="0; url={u}"></noscript>')
              page = page.replace('data-alpha=""', f'data-alpha="{u}"')
              page = page.replace(f'id="alpha-link" href="https://github.com/{repo}/releases"', f'id="alpha-link" href="{u}"')
          open("alpha/index.html", "w").write(page)
          print(url or "no release: the page relies on the GitHub API")
          PY
      - name: Version assets
        # Browsers and Cloudflare cache these for hours; a per-commit query makes each deploy load fresh copies.
        run: |
          python3 - "${GITHUB_SHA::7}" <<'PY'
          import re, sys
          v = sys.argv[1]
          html = open("index.html").read()
          html = re.sub(r'(href|src)="(style\.css|data\.js|app\.js|assets/[^"?]+)"', lambda m: f'{m[1]}="{m[2]}?v={v}"', html)
          open("index.html", "w").write(html)
          # Blog and alpha pages: their stylesheets, scripts and media, at any depth (../style.css, data.js, media/x.webp).
          import glob
          for page in glob.glob("blog/**/index.html", recursive=True) + ["alpha/index.html"]:
              html = open(page).read()
              html = re.sub(r'(href|src|poster)="((?:\.\./)*[\w./-]+\.(?:css|js|webp|jpg|png|svg|mp4|webm))"', lambda m: f'{m[1]}="{m[2]}?v={v}"', html)
              open(page, "w").write(html)
          js = open("app.js").read()
          assert 'assets/games/${img}.jpg"' in js
          open("app.js", "w").write(js.replace('assets/games/${img}.jpg"', 'assets/games/${img}.jpg?v=' + v + '"'))
          PY
          grep -o '?v=[0-9a-f]*' index.html app.js blog/*/index.html blog/index.html | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
