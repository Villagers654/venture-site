# Publishes the site to GitHub Pages. The download buttons read release.json, written here from the
# Venture repo's Releases API; the schedule (or a "venture-release" dispatch) picks up new releases.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  repository_dispatch:
    types: [venture-release]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VENTURE_REPO: ${{ vars.VENTURE_REPO || 'Villagers654/Venture' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Latest release
        env:
          GH_TOKEN: ${{ github.token }}
        # The newest published full release, else the newest pre-release; {"repo": ...} when there is
        # none or the repo is not readable, so the buttons fall back to the releases page.
        run: |
          releases=$(gh api "repos/${VENTURE_REPO}/releases?per_page=20" 2>/dev/null) || releases='[]'
          jq '
            [.[] | select(.draft | not)] as $r
            | ([$r[] | select(.prerelease | not)] + $r)[0] // {}
            | if .tag_name then {
                tag: .tag_name, name, published_at, html_url, prerelease,
                assets: [.assets[] | {name, size, url: .browser_download_url, digest}]
              } else {} end
            | . + {repo: env.VENTURE_REPO}' <<<"$releases" > release.json
          cat release.json
      - name: Version assets
        # Browsers and Cloudflare cache these for hours; a per-commit query makes each deploy load fresh copies.
        run: |
          python3 - "${GITHUB_SHA::7}" <<'PY'
          import re, sys
          v = sys.argv[1]
          html = open("index.html").read()
          html = re.sub(r'(href|src)="(style\.css|data\.js|app\.js|assets/[^"?]+)"', lambda m: f'{m[1]}="{m[2]}?v={v}"', html)
          open("index.html", "w").write(html)
          js = open("app.js").read()
          assert 'assets/games/${img}.jpg"' in js
          open("app.js", "w").write(js.replace('assets/games/${img}.jpg"', 'assets/games/${img}.jpg?v=' + v + '"'))
          PY
          grep -o '?v=[0-9a-f]*' index.html app.js | sort | uniq -c
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v4
        id: deployment
