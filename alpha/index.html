<!doctype html>
<html lang="en" data-repo="Villagers654/Venture" data-alpha="">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- alpha:refresh (pages.yml writes a no-script meta refresh to the newest pre-release here) -->
  <title>Latest alpha: Venture</title>
  <meta name="description" content="Sends you to the newest Venture alpha (pre-release) on GitHub.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1a1b1e">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../style.css">
  <style>
    .go { min-height: calc(var(--vh) * 100 - var(--nav-h)); display: grid; place-content: center; justify-items: center; gap: 18px; padding: 48px var(--gutter); text-align: center; }
    .go h1 { font-size: clamp(30px, 4.6vw, 52px); }
    .go p { color: var(--text2); max-width: 560px; }
    .go p:empty { display: none; }
    .go .btn { margin-top: 10px; height: 52px; padding: 0 26px; font-size: 17px; }
    .go small { color: var(--text3); font-size: 14px; }
    .go small a { color: var(--accent-text); }
  </style>
  <script>
    // Newest Venture pre-release: the GitHub API (newest published, non-draft pre-release) first, so a
    // release published since the last site build counts. If it has not answered within 2 s, or has no
    // answer, the URL pages.yml resolved at build time; with neither, the button stays on the releases list.
    (function () {
      var root = document.documentElement, repo = root.dataset.repo, built = root.dataset.alpha, done = false;
      var ok = function (u) { return typeof u === "string" && u.indexOf("https://github.com/" + repo + "/releases/") === 0; };
      var go = function (u) { done = true; location.replace(u); };
      var fallback = function () {
        if (done) return;
        if (ok(built)) return go(built);
        done = true;
        var s = document.getElementById("status");
        if (s) s.textContent = "Couldn't find the newest alpha. Pick it from the releases list; alphas are marked Pre‑release.";
      };
      // Without a build-time URL there is nothing better to fall back to, so the API gets longer.
      setTimeout(fallback, ok(built) ? 2000 : 6000);
      if (!window.fetch) return fallback();
      fetch("https://api.github.com/repos/" + repo + "/releases?per_page=30", { headers: { Accept: "application/vnd.github+json" } })
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (list) {
          var rel = (Array.isArray(list) ? list : [])
            .filter(function (r) { return r.prerelease && !r.draft && r.published_at; })
            .sort(function (a, b) { return a.published_at < b.published_at ? 1 : -1; })[0];
          if (done) return;
          if (rel && ok(rel.html_url)) return go(rel.html_url);
          fallback();
        })
        .catch(fallback);
    })();
  </script>
</head>
<body>
<header class="nav">
  <div class="wrap nav-in">
    <a class="brand" href="../" aria-label="Venture home"><img src="../assets/logo.svg" alt="" width="36" height="36"><span>Venture</span></a>
  </div>
</header>
<main class="go">
  <h1 class="display">Latest <em>alpha</em></h1>
  <p id="status" role="status"></p>
  <a class="btn primary" id="alpha-link" href="https://github.com/Villagers654/Venture/releases">Open the newest alpha</a>
  <small>Alphas are early test builds. For the stable version, use <a href="https://github.com/Villagers654/Venture/releases/latest">the latest release</a>.</small>
</main>
</body>
</html>
